; إعداد PHP-FPM للإنتاج. (docs/14 بند ٥)
;
; ⚠️ نفس منطق deploy/supervisor/fc-horizon.conf: ملف قالب لسيرفر إنتاج
;    حقيقي (VM/bare-metal) — مش جزء من docker-compose.yml المحلي.
;    pm.max_children لازم يتظبط على (RAM المتاح / متوسط استهلاك العملية)
;    بتاعة السيرفر الفعلي، مش القيمة هنا بالضرورة.
[www]

pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500
