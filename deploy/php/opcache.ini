; إعداد OPcache للإنتاج. (docs/14 بند ٥)
;
; ⚠️ ملف قالب لسيرفر إنتاج حقيقي — مش جزء من docker-compose.yml المحلي،
;    نفس deploy/php/www.conf.
;
; ⚠️ opcache.validate_timestamps=0 معناه إن الكود الجديد مش هيظهر غير
;    بعد opcache_reset() أو إعادة تشغيل FPM. الآلية الفعلية (systemctl،
;    supervisorctl، إلخ) بتختلف حسب مدير العمليات على السيرفر — برّه
;    نطاق القالب ده، ومفيش أمر إعادة تشغيل مُخمَّن هنا بالقصد.
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.jit=tracing
opcache.jit_buffer_size=64M
