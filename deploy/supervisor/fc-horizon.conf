; إعداد Supervisor لتشغيل Horizon في الإنتاج. (docs/13 بند ٤)
;
; ⚠️ ده ملف قالب لسيرفر إنتاج حقيقي (VM/bare-metal) — مش جزء من
;    docker-compose.yml المحلي، اللي بيشغّل Horizon يدوي بـ
;    `php artisan horizon` وقت التطوير. لما تنشر: انسخه لـ
;    /etc/supervisor/conf.d/fc-horizon.conf وعدّل المسارات والمستخدم
;    حسب السيرفر الفعلي.
;
; ⚠️ `stopwaitsecs=3600` إلزامي — بيدي الـ jobs الجارية وقت تخلص قبل ما
;    Horizon يقفل عند إعادة التشغيل أو النشر.
;
; ⚠️ `php artisan horizon:terminate` بعد كل ديبلوي (docs/13 بند ٤) مكانه
;    سكربت النشر (deploy.sh، docs/14 بند ٣) — لسه مبنيش في المشروع
;    (شريحة تانية)، فمش موجود هنا بالقصد.
[program:fc-horizon]
process_name=%(program_name)s
command=php /var/www/app/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/app/storage/logs/horizon.log
stopwaitsecs=3600
