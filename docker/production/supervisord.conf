; الكونتينر بيشغّل أربع عمليات. supervisord هو العملية رقم ١ اللي بتراقبهم.
;
; deploy/supervisor/fc-horizon.conf قالب لسيرفر VM (مساره /var/www/app
; والمستخدم www-data). هنا المسار /var/www/html وHorizon جنبه nginx و
; php-fpm والمجدول، فالملف ده هو النسخة الخاصة بالكونتينر.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
command=php /var/www/html/artisan horizon
user=www-data
autostart=true
autorestart=true
priority=30
; إلزامي (deploy/supervisor/fc-horizon.conf): بيدي الـ jobs الجارية وقت
; تخلص قبل ما Horizon يقفل عند إعادة التشغيل أو النشر.
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
; schedule:work بديل الـ cron جوه الكونتينر — بيصحى كل دقيقة لوحده.
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
