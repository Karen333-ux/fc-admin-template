; القيم من docs/14 بند ٥.
;
; validate_timestamps=0 معناه إن PHP مش بيفحص تغيّر الملفات خالص. ده آمن
; هنا لأن الصورة غير قابلة للتعديل: أي كود جديد معناه صورة جديدة وكونتينر
; جديد، فمفيش حالة يبقى فيها الكود اتغيّر والكاش قديم.
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.jit=tracing
opcache.jit_buffer_size=64M
; Laravel وحزم كتير بتقرا الـ docblocks وقت التشغيل — القيمة دي متتصفّرش.
opcache.save_comments=1
