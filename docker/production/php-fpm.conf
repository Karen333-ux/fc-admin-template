; إعدادات php-fpm للكونتينر.
;
; deploy/php/www.conf فيه pm.max_children = 40، وبيقول صراحةً إن الرقم ده
; لازم يتظبط على (RAM المتاح / متوسط استهلاك العملية) بتاعة السيرفر الفعلي.
; السيرفر هنا 8 جيجا وشايل تطبيق تاني وقاعدة بياناته، وفوقهم Horizon
; بعماله. 8 عمال × ~120 ميجا ≈ 1 جيجا — ده اللي المساحة تسمح بيه.
;
; ارفعي الرقم بعد ما تقيسي الاستهلاك الحقيقي، مش قبل.
[www]

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; إعادة تدوير العمليات: تسريب ذاكرة في طلب واحد ما ينفعش يفضل مع العامل للأبد.
pm.max_requests = 500

; clear_env = no عشان متغيّرات البيئة اللي Coolify بيحقنها توصل للتطبيق.
clear_env = no

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 66M
php_admin_value[max_execution_time] = 300
