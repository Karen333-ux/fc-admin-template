# nginx للإنتاج. النسخة اللي في docker/nginx/default.conf بتوجّه لـ
# `app:9000` — اسم خدمة في docker-compose. هنا كل حاجة في كونتينر واحد،
# فالوجهة هي 127.0.0.1.

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64m;

    # فحص حياة بيرد من nginx نفسه من غير ما يشغّل PHP. ده اللي Coolify
    # بيسأل عليه: بيقيس إن الكونتينر حي، مش إن قاعدة البيانات شغّالة —
    # وده المطلوب، عشان فحص بيلمس PHP بيخلي أي بطء في قاعدة البيانات
    # يتقرا كأن الكونتينر مات ويتعاد تشغيله بلا داعي.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
