# بناء الإنتاج بـ Nixpacks — nginx + php-fpm + Horizon + المجدول.
#
# ⚠️ الملف ده بديل لـ docker/production/Dockerfile مش مكمّل ليه. اللي بيتنفّذ
#    بيتحدد من Build Pack في Coolify: Nixpacks يقرا الملف ده، و Dockerfile
#    يتجاهله تماماً.

[variables]
# Nixpacks بيختار Node 18 افتراضياً، و Vite 7 و Tailwind 4 محتاجين
# 20.19+ أو 22.12+. من غير ده البناء بيقع عند npm run build برسالة عن
# native binding ناقص — وهي عرض جانبي لنسخة Node مش السبب نفسه.
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
# امتدادات بتطلبها الحزم: intl (filament/support)، zip، gd و exif
# (medialibrary)، pcntl (Horizon)، bcmath، redis.
nixPkgs = [
    "...",
    "python311",
    "python311Packages.supervisor",
    "php84Extensions.redis",
    "php84Extensions.intl",
    "php84Extensions.zip",
    "php84Extensions.gd",
    "php84Extensions.exif",
    "php84Extensions.pcntl",
    "php84Extensions.bcmath",
]

[phases.install]
# ⚠️ --no-scripts هو بيت القصيد. post-autoload-dump بيشغّل package:discover
#    و filament:upgrade، والاتنين بيقوموا بتشغيل Laravel كامل — وامتداد redis
#    مابيتحمّلش غير في start.sh وقت التشغيل، فـ DynamicConfigServiceProvider
#    بيقع بـ «Class Redis not found» وقت البناء. الأمرين اتنقلوا لـ start.sh.
#
# تحديد cmds بيستبدل المرحلة بالكامل، فـ npm ci لازم يتكتب صراحةً.
cmds = [
    "composer install --no-dev --ignore-platform-reqs --no-scripts",
    "npm ci",
]

[phases.build]
cmds = [
    # الثيم المخصّص بيتحمّل عبر viteTheme() و public/build متجاهل في git،
    # فمن غير البناء ده كل صفحة في اللوحة بترمي 500.
    "npm run build",

    "mkdir -p /etc/supervisor/conf.d/",
    "mkdir -p /run",
    "mkdir -p /var/log",
    "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "cp /assets/php-fpm.conf /etc/php-fpm.conf",
    "chmod +x /assets/start.sh",

    "mkdir -p /app/storage/logs",
    "mkdir -p /app/storage/framework/cache",
    "mkdir -p /app/storage/framework/sessions",
    "mkdir -p /app/storage/framework/views",
    "chmod -R 775 /app/storage",
    "chown -R www-data:www-data /app/storage /var/log",
]

[start]
cmd = '/assets/start.sh'

[healthcheck]
cmd = 'wget --quiet --tries=1 --spider "http://127.0.0.1:${PORT:-80}/nginx-health" || exit 1'
interval = '10s'
timeout = '5s'
retries = 3
startPeriod = '60s'

[staticAssets]
"start.sh" = '''
#!/bin/bash
#
# ⚠️ الترتيب هنا هو نفس عقد deploy/deploy.sh (docs/14 بند ٣):
#      migrate قبل authorization:sync   (الجداول لازم تكون موجودة)
#      optimize:clear قبل بناء الكاش

node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf

mkdir -p /run /var/log
mkdir -p /app/storage/logs /app/storage/framework/cache /app/storage/framework/sessions /app/storage/framework/views
chmod -R 775 /app/storage
touch /app/storage/logs/laravel.log
chmod 664 /app/storage/logs/laravel.log
chown -R www-data:www-data /var/log /app/storage /app/bootstrap/cache

# تحميل امتداد redis — لازم يسبق أي أمر artisan، لأن مزوّد الإعدادات بيلمس
# Redis وهو بيقوم. Nix بيحط الـ .so في المخزن من غير ما يفعّله.
REDIS_PATH=$(find /nix/store -name "redis.so" | head -n 1)
INI_SCAN_DIR=$(php -r "echo PHP_CONFIG_FILE_SCAN_DIR;" 2>/dev/null)

if [ -n "$INI_SCAN_DIR" ] && [ -d "$INI_SCAN_DIR" ] && [ -n "$REDIS_PATH" ]; then
    echo "extension=$REDIS_PATH" > "$INI_SCAN_DIR/redis.ini"
    cp /assets/php-performance.ini "$INI_SCAN_DIR/zz-performance.ini"

    if ! php -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);' 2>/dev/null; then
        OPCACHE_PATH=$(find /nix/store -name "opcache.so" | head -n 1)
        [ -n "$OPCACHE_PATH" ] && sed -i "1i zend_extension=$OPCACHE_PATH" "$INI_SCAN_DIR/zz-performance.ini"
    fi
fi

mkdir -p /tmp/opcache && chmod 1777 /tmp/opcache

cd /app || exit 1

# اللي كان في composer post-autoload-dump — اتنقل هنا بسبب --no-scripts.
echo "→ اكتشاف الحزم"
php artisan package:discover --ansi
php artisan filament:upgrade

# من غير --path: المشروع فيه ميجريشنز في src/**/Database/Migrations كمان
# (المستأجرين، الإعدادات، تفضيلات الإشعارات) وبتتسجّل من مزوّدي السياقات.
echo "→ الميجريشنز"
php artisan migrate --force

echo "→ مزامنة الصلاحيات"
php artisan authorization:sync

php artisan storage:link || true

echo "→ الكاش"
php artisan optimize:clear
php artisan config:cache
php artisan route:cache
php artisan view:cache
php artisan event:cache
php artisan filament:optimize
php artisan icons:cache

echo "✔ جاهز"
supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
command=bash -c 'REDIS_PATH=$(find /nix/store -name "redis.so" | head -n 1); php-fpm -y /etc/php-fpm.conf -d "extension=$REDIS_PATH" -F'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"worker-horizon.conf" = '''
; المشروع بيستخدم Horizon مش queue:work — الطوابير والأولويات في
; config/horizon.php، وسقوف العمال بتتقرا من متغيّرات HORIZON_*.
[program:worker-horizon]
command=php /app/artisan horizon
user=www-data
autostart=true
autorestart=true
; إلزامي: بيدي الـ jobs الجارية وقت تخلص قبل ما Horizon يقفل.
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"worker-scheduler.conf" = '''
[program:worker-scheduler]
command=php /app/artisan schedule:work
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
'''

"php-fpm.conf" = '''
[global]
pid = /run/php-fpm.pid
error_log = /var/log/php-fpm.log
daemonize = no

[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data

; السيرفر مشترك مع تطبيقات تانية وقواعد بياناتها ومفيش swap.
; (الذاكرة المتاحة - 1G) / 150M ≈ 8 عمال.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
clear_env = no

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 66M
php_admin_value[max_execution_time] = 300
php_admin_value[error_log] = /var/log/php-fpm.error.log
php_admin_value[sys_temp_dir] = /tmp
'''

"php-performance.ini" = '''
; القيم من docs/14 بند ٥، مصغّرة لسيرفر مشترك.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; مش 0: مشغّل بيعمل config:cache جوه كونتينر شغّال لازم يشوف الأثر.
opcache.validate_timestamps=1
opcache.revalidate_freq=60
; Laravel وحزم كتير بتقرا الـ docblocks — متتصفّرش أبداً.
opcache.save_comments=1
opcache.enable_cli=1
opcache.file_cache=/tmp/opcache
opcache.file_cache_fallback=1
opcache.jit=tracing
opcache.jit_buffer_size=64M

realpath_cache_size=4096k
realpath_cache_ttl=600
'''

"nginx.template.conf" = '''
user www-data www-data;
worker_processes auto;
daemon off;
worker_rlimit_nofile 8192;

events { worker_connections 4096; }

http {
    include    $!{nginx}/conf/mime.types;
    index    index.php;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr;
    sendfile on;
    tcp_nopush on;
    server_names_hash_bucket_size 128;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app/public;
        )

        client_max_body_size 64M;
        charset utf-8;

        # فحص حياة بيرد من nginx من غير ما يشغّل PHP — بيقيس إن الحاوية حيّة،
        # مش إن قاعدة البيانات شغّالة.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / { try_files $uri $uri/ /index.php?$query_string; }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
            fastcgi_read_timeout 300;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
        }

        location ~ /\.(?!well-known).* { deny all; }
    }
}
'''
